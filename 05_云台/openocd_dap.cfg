# DAPLink / CMSIS-DAP，通过 HID 接口连接。
# 当前探针：Horco CMSIS-DAP v2，USB VID:PID = faed:4873。
source [find interface/cmsis-dap.cfg]
# 该探针（FW V208 v0.1）在 HID 通道上会 CMD_INFO 收发错位，
# 导致 "CMSIS-DAP command CMD_DISCONNECT failed"。必须走 v2 的 WinUSB bulk 接口。
cmsis_dap_backend usb_bulk

# 按序列号锁定探针（默认关闭，方便更换探针）。
# 若同时插了多颗 CMSIS-DAP，必须打开并填正确序列号，否则 OpenOCD 会
# 按枚举顺序随便挑一颗，可能选中不支持 SWD 的探针。
# 查询序列号：
#   openocd -f interface/cmsis-dap.cfg -c "init" -c "shutdown" 2>&1 | grep -i serial
# 例如原来的 PUSO_DAPLink 是 puso_daplink_lab。
# cmsis_dap_serial puso_daplink_lab

transport select swd
source [find target/stm32f4x.cfg]

# 放在 target 配置之后，避免被其默认速度覆盖。
# 无线 DAPLink 使用 1000 kHz，连接不稳定时可将此变量降到 100。
set DAP_SPEED_KHZ 1000
adapter speed $DAP_SPEED_KHZ

# stm32f4x.cfg 的默认复位事件会改成 2000 / 8000 kHz。
# 本工程保持 1000 kHz；复位后使用默认 HSI，Flash 算法在此频率下运行。
$_TARGETNAME configure -event reset-start { adapter speed $::DAP_SPEED_KHZ }
$_TARGETNAME configure -event reset-init { adapter speed $::DAP_SPEED_KHZ }
