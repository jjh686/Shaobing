source [find interface/cmsis-dap.cfg]
cmsis_dap_backend hid
cmsis_dap_vid_pid 0xc251 0xf001
cmsis_dap_serial 0001A0000002
transport select swd
source [find target/stm32f4x.cfg]
adapter speed 100
reset_config none
stm32f4x.cpu configure -event examine-end {}
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
echo "INITIAL_STATE [stm32f4x.cpu curstate]"
dump_image {/home/wangjiaming/桌面/rm_nav_source_20261110(zbh)/local/swd-diagnosis-20261111_132456/current_flash_first32K.bin} 0x08000000 0x8000
echo "FINAL_STATE [stm32f4x.cpu curstate]"
shutdown
