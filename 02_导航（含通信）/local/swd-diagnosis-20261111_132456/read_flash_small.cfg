source [find interface/cmsis-dap.cfg]
cmsis_dap_backend hid
cmsis_dap_vid_pid 0xc251 0xf001
cmsis_dap_serial 0001A0000002
transport select swd
source [find target/stm32f4x.cfg]
adapter speed 50
reset_config none
stm32f4x.cpu configure -event examine-end {}
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
echo "INITIAL_STATE [stm32f4x.cpu curstate]"
echo "FLASH [mdw 0x08000000 8]"
sleep 20
echo "FLASH [mdw 0x08000020 8]"
sleep 20
echo "FLASH [mdw 0x08000040 8]"
sleep 20
echo "FLASH [mdw 0x08000060 8]"
sleep 20
echo "FLASH [mdw 0x08000080 8]"
sleep 20
echo "FLASH [mdw 0x080000a0 8]"
sleep 20
echo "FLASH [mdw 0x080000c0 8]"
sleep 20
echo "FLASH [mdw 0x080000e0 8]"
sleep 20
echo "FLASH [mdw 0x08001020 8]"
sleep 20
echo "FLASH [mdw 0x08001040 8]"
sleep 20
echo "FLASH [mdw 0x08001060 8]"
sleep 20
echo "FLASH [mdw 0x08001080 8]"
sleep 20
echo "FLASH [mdw 0x080010a0 8]"
sleep 20
echo "FLASH [mdw 0x080010c0 8]"
sleep 20
echo "FINAL_STATE [stm32f4x.cpu curstate]"
shutdown
