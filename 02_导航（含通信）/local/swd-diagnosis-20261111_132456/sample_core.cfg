source [find interface/cmsis-dap.cfg]
cmsis_dap_backend hid
cmsis_dap_vid_pid 0xc251 0xf001
cmsis_dap_serial 0001A0000002
transport select swd
source [find target/stm32f4x.cfg]
adapter speed 100
reset_config none
stm32f4x.cpu configure -event examine-end {}
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
echo "INITIAL_STATE [stm32f4x.cpu curstate]"
echo "IDCODE [mdw 0xe0042000 1]"
echo "UID [mdw 0x1fff7a10 3]"
echo "FLASH_SIZE [mdh 0x1fff7a22 1]"
echo "VECTORS [mdw 0x08000000 4]"
set sample_result [catch {
    halt 2000
    echo "HALTED_STATE [stm32f4x.cpu curstate]"
    echo "PC [reg pc]"
    echo "LR [reg lr]"
    echo "MSP [reg msp]"
    echo "PSP [reg psp]"
    echo "SCB_ICSR [mdw 0xe000ed04 1]"
    echo "SCB_FAULTS [mdw 0xe000ed28 7]"
    echo "RCC [mdw 0x40023800 3]"
    echo "RCC_AHB2ENR [mdw 0x40023834 1]"
    echo "GPIOA_MODE [mdw 0x40020000 1]"
    echo "GPIOA_AFRH [mdw 0x40020024 1]"
    echo "USB_GOTGCTL [mdw 0x50000000 1]"
    echo "USB_GCCFG [mdw 0x50000038 1]"
    echo "USB_DCFG_DCTL_DSTS [mdw 0x50000800 3]"
} sample_error]
catch {resume} resume_error
echo "RESUME_RESULT $resume_error"
echo "FINAL_STATE [stm32f4x.cpu curstate]"
if {$sample_result} {echo "SAMPLE_ERROR $sample_error"}
shutdown
