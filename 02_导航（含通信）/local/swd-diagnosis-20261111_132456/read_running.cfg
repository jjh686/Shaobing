source [find interface/cmsis-dap.cfg]
cmsis_dap_backend hid
cmsis_dap_vid_pid 0xc251 0xf001
cmsis_dap_serial 0001A0000002
transport select swd
source [find target/stm32f4x.cfg]
adapter speed 100
reset_config none
stm32f4x.cpu configure -event examine-end {}
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
poll
mdw 0xe0042000 1
mdw 0x1fff7a10 3
mdh 0x1fff7a22 1
mdw 0x08000000 4
mdw 0xe000ed04 1
mdw 0xe000ed28 7
mdw 0x40023800 3
mdw 0x40023834 1
mdw 0x50000000 1
mdw 0x50000038 1
mdw 0x50000800 1
mdw 0x50000804 1
mdw 0x50000808 1
shutdown
