bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: live/odometry
    bt_loop_duration: 10
    default_server_timeout: 100
    plugin_lib_names: [nav2_compute_path_to_pose_action_bt_node, nav2_follow_path_action_bt_node, nav2_pipeline_sequence_bt_node, nav2_rate_controller_bt_node]
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    odom_topic: live/odometry
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.08
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.1
      lookahead_dist: 0.4
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.6
      lookahead_time: 1.5
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.03
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 4.0
      use_rotate_to_heading: false
      rotate_to_heading_angular_vel: 0.2
      max_angular_accel: 0.4
      allow_reversing: false
planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.15
      use_astar: true
      allow_unknown: false
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: camera_init
      robot_base_frame: base_footprint
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      transform_tolerance: 0.15
      footprint_padding: 0.05
      track_unknown_space: true
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /live/scan
          data_type: LaserScan
          # Scan points are projected onto the chassis ground plane. LIO's
          # world origin is at the IMU, so that plane can have negative world Z.
          # Physical height filtering already happened in live_scan.
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          clearing: true
          marking: true
          inf_is_valid: true
          obstacle_max_range: 8.0
          raytrace_max_range: 10.0
          obstacle_min_range: 0.1
          raytrace_min_range: 0.1
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        inflation_radius: 0.8
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 0.15
      footprint_padding: 0.05
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        map_topic: /map
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /live/scan
          data_type: LaserScan
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          clearing: true
          marking: true
          inf_is_valid: true
          obstacle_max_range: 8.0
          raytrace_max_range: 10.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        inflation_radius: 0.8
