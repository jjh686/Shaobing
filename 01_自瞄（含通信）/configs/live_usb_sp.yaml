yolo11_model_path: /home/wangjiaming/文档/GitHub/RM_11_13/01_自瞄（含通信）/assets/yolo11.xml
yolov8_model_path: /home/wangjiaming/文档/GitHub/RM_11_13/01_自瞄（含通信）/assets/yolov8.xml
