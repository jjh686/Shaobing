# 仅供图形化烧录工具（如 EmberProbe）选择"探针"用的配置，
# 目标芯片配置由工具单独追加（stm32f4x.cfg）。
#
# PUSO_DAPLink (VID:PID 1234:5678) 的 v2/bulk 接口会被 Linux 内核
# usbtouchscreen 驱动抢占，导致 USB 读写 I/O Error，
# 因此强制使用 v1/HID 后端（与 openocd_dap.cfg 一致）。
source [find interface/cmsis-dap.cfg]
cmsis_dap_backend hid
transport select swd

adapter speed 1000
