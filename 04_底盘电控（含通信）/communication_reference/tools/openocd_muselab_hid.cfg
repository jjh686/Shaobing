# EmberProbe: select this file as the probe/interface script.
# Select target/stm32f4x.cfg SEPARATELY as the target script.
# Only interface configuration; does not write, halt or reset a target on load.
source [find interface/cmsis-dap.cfg]
cmsis-dap backend hid
cmsis-dap vid_pid 0xc251 0xf001
adapter serial 0001A0000002
transport select swd
adapter speed 100
